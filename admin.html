<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0E1022;
            --card: #15182E;
            --input: #121528;
            --primary: #4F6BFF;
            --success: #10B981;
            --danger: #EF4444;
            --text-main: #FFFFFF;
            --text-muted: #8E96B5;
            --border: #222744;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); padding: 16px; min-height: 100vh; }
        .container { max-width: 700px; margin: 0 auto; }
        .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
        .input-group input { width: 100%; background-color: var(--input); border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 10px; font-size: 13px; outline: none; color-scheme: dark; }
        .btn-submit { width: 100%; background-color: var(--primary); color: #fff; border: none; padding: 13px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
        th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--text-muted); }
        .btn-del { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-weight: 700; }
    </style>
</head>
<body>

<div class="container">
    <!-- ADMIN LOGIN -->
    <div id="adminLoginView" class="card" style="max-width: 380px; margin: 80px auto;">
        <h2 style="color: var(--primary); text-align: center; margin-bottom: 20px;">MASTER ADMIN LOGIN</h2>
        <form onsubmit="adminLogin(event)">
            <div class="input-group">
                <label>Admin Username</label>
                <input type="text" id="admin_user" required>
            </div>
            <div class="input-group">
                <label>Admin Password</label>
                <input type="password" id="admin_pass" required>
            </div>
            <button type="submit" class="btn-submit">LOGIN</button>
        </form>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="adminDashView" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>🛡️ Admin Control Panel</h2>
            <button class="btn-del" onclick="adminLogout()">Logout</button>
        </div>

        <div class="card">
            <h3>➕ Add New Reseller</h3>
            <form onsubmit="addReseller(event)" style="margin-top: 10px;">
                <div class="input-group"><label>Reseller Username</label><input type="text" id="new_res_user" required></div>
                <div class="input-group"><label>Password</label><input type="text" id="new_res_pass" required></div>
                <div class="input-group"><label>Initial Balance (₹)</label><input type="number" id="new_res_bal" value="1000" required></div>
                <button type="submit" class="btn-submit">CREATE RESELLER</button>
            </form>
        </div>

        <div class="card">
            <h3>👥 Manage Resellers</h3>
            <table>
                <thead><tr><th>Username</th><th>Balance</th><th>Action</th></tr></thead>
                <tbody id="resellersTableBody"><tr><td colspan="3" style="text-align:center;">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API_BASE = window.location.origin;
    let isAdminLoggedIn = localStorage.getItem('admin_logged') === 'true';

    if (isAdminLoggedIn) showAdminDash();

    async function adminLogin(e) {
        e.preventDefault();
        const u = document.getElementById('admin_user').value.trim();
        const p = document.getElementById('admin_pass').value.trim();
        const body = new URLSearchParams({ username: u, password: p });
        const res = await fetch(`${API_BASE}/admin/login`, { method: 'POST', body });
        const data = await res.json();
        if (data.success) {
            localStorage.setItem('admin_logged', 'true');
            showAdminDash();
        } else { alert(data.msg); }
    }

    function adminLogout() {
        localStorage.removeItem('admin_logged');
        location.reload();
    }

    function showAdminDash() {
        document.getElementById('adminLoginView').style.display = 'none';
        document.getElementById('adminDashView').style.display = 'block';
        loadAdminData();
    }

    async function loadAdminData() {
        const res = await fetch(`${API_BASE}/admin/data`);
        const data = await res.json();
        if (!data.success) return;

        let tbody = document.getElementById('resellersTableBody');
        let resellers = data.resellers || {};
        let html = '';
        for (let uname in resellers) {
            let r = resellers[uname];
            html += `<tr>
                <td><b>${uname}</b></td>
                <td>₹${r.balance || 0}</td>
                <td><button class="btn-del" onclick="deleteReseller('${uname}')">Delete</button></td>
            </tr>`;
        }
        tbody.innerHTML = html || '<tr><td colspan="3" style="text-align:center;">No resellers found</td></tr>';
    }

    async function addReseller(e) {
        e.preventDefault();
        const u = document.getElementById('new_res_user').value.trim();
        const p = document.getElementById('new_res_pass').value.trim();
        const b = document.getElementById('new_res_bal').value;
        const body = new URLSearchParams({ username: u, password: p, balance: b });
        const res = await fetch(`${API_BASE}/admin/add_reseller`, { method: 'POST', body });
        const data = await res.json();
        alert(data.msg);
        loadAdminData();
    }

    async function deleteReseller(username) {
        if (!confirm(`Delete reseller ${username}?`)) return;
        const body = new URLSearchParams({ username });
        await fetch(`${API_BASE}/admin/delete_reseller`, { method: 'POST', body });
        loadAdminData();
    }
</script>

</body>
</html>
