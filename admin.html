<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Master Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #0b0c16;
      color: #e2e8f0;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .wrapper {
      width: 100%;
      max-width: 480px;
    }
    .card {
      background: #141727;
      border: 1px solid #232845;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    h2 {
      font-size: 18px;
      font-weight: 800;
      color: #6366f1;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    label {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      display: block;
      margin: 10px 0 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      background: #0d0f1c;
      border: 1px solid #232742;
      border-radius: 9px;
      padding: 11px 14px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #6366f1;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      margin-top: 14px;
      transition: all 0.2s;
    }
    .btn-green { background: #16a34a; color: #fff; }
    .btn-green:hover { background: #15803d; }
    .btn-action {
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-del { background: #311319; color: #f87171; border: 1px solid #451a23; }
    .btn-recharge { background: #14281f; color: #34d399; border: 1px solid #1c3b2d; }

    .reseller-item {
      background: #0d0f1b;
      border: 1px solid #1f233d;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
    }
    .reseller-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .reseller-id {
      font-size: 15px;
      font-weight: 800;
      color: #60a5fa;
    }
    .badge-days {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .badge-active { background: #064e3b; color: #34d399; }
    .badge-expired { background: #451a1a; color: #f87171; }

    .reseller-info {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.6;
    }
    .actions-row {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      justify-content: flex-end;
    }
  </style>
</head>
<body>

<div class="wrapper">
  
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding: 0 4px;">
    <span style="font-weight: 800; color: #6366f1; font-size: 16px;">MASTER CONTROL PANEL</span>
    <button onclick="loadResellers()" style="background:#1e233d; border:none; color:#38bdf8; font-size:12px; font-weight:700; padding:6px 12px; border-radius:8px; cursor:pointer;">Refresh</button>
  </div>

  <!-- CREATE RESELLER CARD -->
  <div class="card">
    <h2>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7.5" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
      CREATE RESELLER
    </h2>

    <label>Reseller User ID / Username</label>
    <input type="text" id="rUser" placeholder="e.g. roman / aman123">

    <label>Reseller Password</label>
    <input type="text" id="rPass" placeholder="e.g. pass1234">

    <label>Validity (Kitne Din Tak Chalega)</label>
    <input type="number" id="rDays" value="30" placeholder="Number of days (e.g. 30)">

    <label>Initial Wallet Balance (₹)</label>
    <input type="number" id="rBal" value="500" placeholder="Wallet balance (e.g. 500)">

    <button class="btn btn-green" onclick="createReseller()">CREATE RESELLER ID</button>
  </div>

  <!-- REGISTERED RESELLERS LIST -->
  <div class="card">
    <h2>RESELLER IDS</h2>
    <div id="resellersList" style="margin-top: 10px;">Loading resellers...</div>
  </div>

</div>

<script>
  const API_URL = "https://vip-auth-api-1.onrender.com";

  document.addEventListener("DOMContentLoaded", () => {
    loadResellers();
  });

  function createReseller() {
    const u = document.getElementById("rUser").value.trim().toLowerCase();
    const p = document.getElementById("rPass").value.trim();
    const d = document.getElementById("rDays").value;
    const b = document.getElementById("rBal").value;

    if (!u || !p || !d) return alert("Username, Password aur Validity Days fill karein!");

    fetch(`${API_URL}/admin/create_reseller`, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: `username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}&days=${d}&balance=${b}`
    })
    .then(r => r.json())
    .then(data => {
      alert(data.msg);
      document.getElementById("rUser").value = "";
      document.getElementById("rPass").value = "";
      loadResellers();
    })
    .catch(() => alert("Error creating reseller!"));
  }

  function loadResellers() {
    fetch(`${API_URL}/admin/get_resellers`)
    .then(r => r.json())
    .then(list => {
      const box = document.getElementById("resellersList");
      if (!list || list.length === 0) {
        box.innerHTML = `<div style="font-size: 12px; color: #64748b; text-align:center; padding: 20px;">Koi reseller create nahi kiya gaya hai.</div>`;
        return;
      }

      const now = Date.now();
      box.innerHTML = list.map(r => {
        const remDays = r.expiry_timestamp > 0 ? Math.ceil((r.expiry_timestamp - now) / (1000 * 60 * 60 * 24)) : 0;
        const isExp = remDays <= 0 && r.expiry_timestamp > 0;
        const expDate = r.expiry_timestamp > 0 ? new Date(r.expiry_timestamp).toLocaleDateString('en-GB') : 'Unlimited';

        return `
          <div class="reseller-item">
            <div class="reseller-header">
              <span class="reseller-id">${r.username}</span>
              <span class="badge-days ${isExp ? 'badge-expired' : 'badge-active'}">
                ${isExp ? 'EXPIRED' : remDays + ' DIN BAAKI'}
              </span>
            </div>
            <div class="reseller-info">
              <div>Password: <strong style="color: #facc15;">${r.password || 'N/A'}</strong></div>
              <div>Wallet Balance: <strong style="color: #22c55e;">₹${parseFloat(r.balance).toFixed(2)}</strong></div>
              <div>Valid Till: <strong style="color: #cbd5e1;">${expDate}</strong></div>
            </div>
            <div class="actions-row">
              <button class="btn-action btn-recharge" onclick="addBal('${r.username}')">+₹100 Wallet</button>
              <button class="btn-action btn-del" onclick="delReseller('${r.username}')">Delete ID</button>
            </div>
          </div>
        `;
      }).join('');
    })
    .catch(() => {
      document.getElementById("resellersList").innerHTML = `<div style="color:#ef4444; font-size:12px; text-align:center; padding:15px;">Failed to load data. 15 second baad Refresh dabayein.</div>`;
    });
  }

  function addBal(u) {
    fetch(`${API_URL}/admin/recharge_reseller`, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: `username=${u}&amount=100`
    }).then(() => loadResellers());
  }

  function delReseller(u) {
    if (!confirm(`Delete Reseller ID: ${u}?`)) return;
    fetch(`${API_URL}/admin/delete_reseller`, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: `username=${u}`
    }).then(() => loadResellers());
  }
</script>

</body>
</html>
