<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Control Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090B14;
            --card: #13172E;
            --card-inner: #0D1022;
            --input: #0A0C1A;
            --primary: #6366F1;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --text-main: #FFFFFF;
            --text-muted: #8E96B5;
            --border: #222849;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); padding: 22px 14px; min-height: 100vh; }
        .container { max-width: 850px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 20px; font-weight: 800; color: #60A5FA; }
        .btn-refresh { background-color: #252B4D; color: #38BDF8; border: none; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; }
        .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 20px; margin-bottom: 20px; }
        .card-title { font-size: 13px; font-weight: 700; color: var(--primary); text-transform: uppercase; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
        
        /* Stats Grid (Clickable Filters) */
        .stats-grid-2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .stat-box { background-color: var(--card-inner); border: 1px solid var(--border); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: 0.2s; }
        .stat-box:hover, .stat-box.active-filter { border-color: var(--primary); background-color: #1a1f3c; }
        .stat-box-title { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .stat-box-val { font-size: 20px; font-weight: 800; color: #FFFFFF; margin-top: 6px; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 14px; }
        .input-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
        .input-group input, .input-group select { width: 100%; background-color: var(--input); border: 1px solid var(--border); color: #fff; padding: 11px 13px; border-radius: 12px; font-size: 13px; outline: none; color-scheme: dark; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-act { flex: 1; min-width: 160px; padding: 12px; border: none; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; }
        .btn-danger { background-color: var(--danger); color: #fff; }
        .btn-success { background-color: var(--success); color: #fff; }
        .btn-info { background-color: #38BDF8; color: #090B14; }
        .btn-secondary { background-color: #252B4D; color: #F8FAFC; }
        
        .admin-item { background-color: var(--card-inner); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .admin-name { font-size: 15px; font-weight: 700; color: #60A5FA; }
        .admin-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
        .badge-active { background: rgba(16,185,129,0.15); color: #10B981; }
        .badge-expired { background: rgba(239,68,68,0.15); color: #EF4444; }
        .badge-blocked { background: rgba(245,158,11,0.15); color: #F59E0B; }
        
        .btn-small { border: none; padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; margin-left: 4px; }
        
        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); justify-content: center; align-items: center; padding: 16px; z-index: 200; }
        .modal-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px; width: 100%; max-width: 360px; }
        .modal-card h3 { font-size: 15px; margin-bottom: 14px; color: #60A5FA; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>👑 MASTER CONTROL (OWNER)</h1>
        <button class="btn-refresh" onclick="loadAll()">REFRESH</button>
    </div>

    <!-- STATS COUNTER BOXES (Clickable Filters) -->
    <div class="stats-grid-2x2">
        <div class="stat-box active-filter" id="filterAll" onclick="setFilter('all')">
            <span class="stat-box-title">Total Admins</span>
            <span class="stat-box-val" id="statTotal" style="color:#60A5FA;">0</span>
        </div>
        <div class="stat-box" id="filterActive" onclick="setFilter('active')">
            <span class="stat-box-title">Active</span>
            <span class="stat-box-val" id="statActive" style="color:#10B981;">0</span>
        </div>
        <div class="stat-box" id="filterBlocked" onclick="setFilter('blocked')">
            <span class="stat-box-title">Blocked</span>
            <span class="stat-box-val" id="statBlocked" style="color:#F59E0B;">0</span>
        </div>
        <div class="stat-box" id="filterExpired" onclick="setFilter('expired')">
            <span class="stat-box-title">Expired</span>
            <span class="stat-box-val" id="statExpired" style="color:#EF4444;">0</span>
        </div>
    </div>

    <!-- 1. APP REMOTE CONTROL -->
    <div class="card">
        <div class="card-title">
            <span>🛡️ APP REMOTE KILL-SWITCH & LIVE ALERT</span>
            <span id="appStatusBadge" style="color: #10B981;">CHECKING...</span>
        </div>
        <div class="btn-group" style="margin-bottom: 16px;">
            <button type="button" class="btn-act btn-danger" onclick="setAppStatus('disabled')">🛑 CRASH / DEACTIVATE APP</button>
            <button type="button" class="btn-act btn-success" onclick="setAppStatus('active')">✅ ACTIVATE APP</button>
        </div>
        <div style="border-top: 1px solid var(--border); padding-top: 14px;">
            <div class="form-grid">
                <div class="input-group">
                    <label>Alert Popup Title</label>
                    <input type="text" id="alert_title" placeholder="Notice / Maintenance">
                </div>
                <div class="input-group">
                    <label>Alert Message</label>
                    <input type="text" id="alert_msg" placeholder="App maintenance in progress.">
                </div>
            </div>
            <div class="btn-group">
                <button type="button" class="btn-act btn-info" onclick="sendAppAlert(true)">📢 BROADCAST ALERT</button>
                <button type="button" class="btn-act btn-secondary" onclick="sendAppAlert(false)">❌ CLEAR ALERT</button>
            </div>
        </div>
    </div>

    <!-- 2. CREATE ADMIN ACCOUNT -->
    <div class="card">
        <div class="card-title">👤 CREATE ADMIN (SUB-ADMIN) ACCOUNT</div>
        <form onsubmit="createAdmin(event)">
            <div class="form-grid">
                <div class="input-group">
                    <label>Admin User ID</label>
                    <input type="text" id="new_admin_user" placeholder="e.g. subadmin1" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="text" id="new_admin_pass" placeholder="Enter password" required>
                </div>
                <div class="input-group">
                    <label>Expiry / Duration</label>
                    <select id="new_admin_duration">
                        <option value="never">Never (Lifetime)</option>
                        <option value="1d">1 Day</option>
                        <option value="7d">7 Days</option>
                        <option value="30d" selected>30 Days</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn-act btn-success" style="width: 100%;">CREATE ADMIN ID</button>
        </form>
    </div>

    <!-- 3. ADMINS LIST -->
    <div class="card">
        <div class="card-title">
            <span id="adminsListTitle">📋 REGISTERED ADMINS (ALL)</span>
        </div>
        <div id="adminsList"><div style="text-align: center; color: var(--text-muted); padding: 15px;">Loading admins...</div></div>
    </div>
</div>

<!-- EDIT ADMIN MODAL -->
<div class="modal" id="editAdminModal">
    <div class="modal-card">
        <h3>Edit Admin: <span id="editAdminName" style="color:#60A5FA;"></span></h3>
        <div class="input-group">
            <label>New Password</label>
            <input type="text" id="editAdminPass" placeholder="Leave blank to keep same">
        </div>
        <div class="input-group" style="margin-top:10px;">
            <label>Status</label>
            <select id="editAdminStatus">
                <option value="active">ACTIVE</option>
                <option value="blocked">BLOCKED</option>
            </select>
        </div>
        <div class="input-group" style="margin-top:10px;">
            <label>Extend Expiry (Days from now)</label>
            <input type="number" id="editAdminDays" placeholder="e.g. 30 (Leave blank if no change)">
        </div>
        <div class="modal-actions">
            <button class="btn-act" onclick="closeEditModal()" style="background: transparent; color: var(--text-muted);">Cancel</button>
            <button class="btn-act btn-success" onclick="submitEditAdmin()">Save Changes</button>
        </div>
    </div>
</div>

<script>
    const API_BASE = window.location.origin;
    let editingAdminUser = '';
    let adminsGlobalData = [];
    let currentFilter = 'all';

    function loadAll() {
        loadAppControl();
        loadAdmins();
    }

    async function loadAppControl() {
        try {
            const res = await fetch(`${API_BASE}/master/get_app_control`);
            const data = await res.json();
            const badge = document.getElementById('appStatusBadge');
            if (data.status === 'disabled') {
                badge.innerText = 'STATUS: DISABLED (CRASHED)';
                badge.style.color = '#EF4444';
            } else {
                badge.innerText = 'STATUS: ACTIVE (NORMAL)';
                badge.style.color = '#10B981';
            }
            if (data.show_alert) {
                document.getElementById('alert_title').value = data.alert_title || '';
                document.getElementById('alert_msg').value = data.alert_msg || '';
            }
        } catch (e) {}
    }

    async function setAppStatus(status) {
        if (!confirm(status === 'disabled' ? "Sabhi users ke phone me APP CRASH/BAND karein?" : "App ko wapas ACTIVATE karein?")) return;
        const body = new URLSearchParams({
            status: status,
            show_alert: status === 'disabled' ? 'true' : 'false',
            alert_title: status === 'disabled' ? "APP STOPPED" : "",
            alert_msg: status === 'disabled' ? "App is temporarily disabled by Master Admin." : ""
        });
        try {
            const res = await fetch(`${API_BASE}/master/set_app_control`, { method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: body });
            const data = await res.json();
            alert(data.msg || "Updated");
            loadAppControl();
        } catch (e) { alert("Error!"); }
    }

    async function sendAppAlert(showAlert) {
        const title = document.getElementById('alert_title').value.trim();
        const msg = document.getElementById('alert_msg').value.trim();
        if (showAlert && (!title || !msg)) return alert("Title aur Message dono bharein!");
        const body = new URLSearchParams({ status: 'active', alert_title: title, alert_msg: msg, show_alert: showAlert ? 'true' : 'false' });
        try {
            const res = await fetch(`${API_BASE}/master/set_app_control`, { method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: body });
            const data = await res.json();
            alert(showAlert ? "Alert Broadcasted!" : "Alert Cleared!");
            loadAppControl();
        } catch (e) { alert("Error!"); }
    }

    function setFilter(filterType) {
        currentFilter = filterType;
        ['All', 'Active', 'Blocked', 'Expired'].forEach(f => {
            const el = document.getElementById('filter' + f);
            if (el) el.classList.remove('active-filter');
        });
        const selectedEl = document.getElementById('filter' + filterType.charAt(0).toUpperCase() + filterType.slice(1));
        if (selectedEl) selectedEl.classList.add('active-filter');
        renderAdminsList();
    }

    async function loadAdmins() {
        try {
            const res = await fetch(`${API_BASE}/master/get_admins`);
            adminsGlobalData = await res.json();
            processAndRenderAdmins();
        } catch (e) {
            document.getElementById('adminsList').innerHTML = '<div style="color:red; text-align:center;">Load fail</div>';
        }
    }

    function processAndRenderAdmins() {
        const now = Date.now();
        let total = adminsGlobalData.length;
        let active = 0, blocked = 0, expired = 0;

        adminsGlobalData.forEach(a => {
            const exp = a.expiry_timestamp || 0;
            const remDays = exp > 0 ? Math.ceil((exp - now) / (1000 * 60 * 60 * 24)) : 0;
            const isExp = remDays <= 0 && exp > 0;
            let status = a.status || 'active';
            if (isExp) status = 'expired';

            if (status === 'active') active++;
            else if (status === 'blocked') blocked++;
            else if (status === 'expired') expired++;
        });

        document.getElementById('statTotal').innerText = total;
        document.getElementById('statActive').innerText = active;
        document.getElementById('statBlocked').innerText = blocked;
        document.getElementById('statExpired').innerText = expired;

        renderAdminsList();
    }

    function renderAdminsList() {
        const container = document.getElementById('adminsList');
        const now = Date.now();

        let filteredAdmins = adminsGlobalData.filter(a => {
            const exp = a.expiry_timestamp || 0;
            const remDays = exp > 0 ? Math.ceil((exp - now) / (1000 * 60 * 60 * 24)) : 0;
            const isExp = remDays <= 0 && exp > 0;
            let status = a.status || 'active';
            if (isExp) status = 'expired';

            if (currentFilter === 'all') return true;
            if (currentFilter === 'active') return status === 'active';
            if (currentFilter === 'blocked') return status === 'blocked';
            if (currentFilter === 'expired') return status === 'expired';
            return true;
        });

        document.getElementById('adminsListTitle').innerText = `📋 REGISTERED ADMINS (${currentFilter.toUpperCase()})`;

        if (filteredAdmins.length === 0) {
            container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 15px;">Is filter me koi admin nahi hai.</div>';
            return;
        }

        let html = '';
        filteredAdmins.forEach(a => {
            const exp = a.expiry_timestamp || 0;
            const remDays = exp > 0 ? Math.ceil((exp - now) / (1000 * 60 * 60 * 24)) : 0;
            const isExp = remDays <= 0 && exp > 0;
            let status = a.status || 'active';
            if (isExp) status = 'expired';

            let badgeClass = 'badge-active';
            let badgeText = remDays + ' DIN BAAKI';
            if (status === 'blocked') { badgeClass = 'badge-blocked'; badgeText = 'BLOCKED'; }
            else if (status === 'expired' || isExp) { badgeClass = 'badge-expired'; badgeText = 'EXPIRED'; }
            else if (exp === 0) { badgeText = 'LIFETIME'; }

            html += `
                <div class="admin-item">
                    <div>
                        <div class="admin-name">👑 ${String(a.username).toUpperCase()} <span class="badge ${badgeClass}">${badgeText}</span></div>
                        <div class="admin-sub">Password: <b>${a.password}</b></div>
                    </div>
                    <div>
                        <button class="btn-small" style="background:#1B223C; color:#38BDF8;" onclick="openEditAdmin('${a.username}', '${a.password}', '${a.status || 'active'}')">EDIT</button>
                        <button class="btn-small" style="background:#2D151B; color:#EF4444;" onclick="deleteAdmin('${a.username}')">DEL</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    async function createAdmin(e) {
        e.preventDefault();
        const u = document.getElementById('new_admin_user').value.trim().toLowerCase();
        const p = document.getElementById('new_admin_pass').value.trim();
        const dur = document.getElementById('new_admin_duration').value;
        
        let daysVal = 30;
        if (dur === 'never') daysVal = 36500;
        else if (dur === '1d') daysVal = 1;
        else if (dur === '7d') daysVal = 7;
        else if (dur === '30d') daysVal = 30;

        const body = new URLSearchParams({ username: u, password: p, days: daysVal });
        try {
            const res = await fetch(`${API_BASE}/master/create_admin`, { method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: body });
            const data = await res.json();
            alert(data.msg || "Created!");
            if (data.success) {
                document.getElementById('new_admin_user').value = '';
                document.getElementById('new_admin_pass').value = '';
                loadAdmins();
            }
        } catch (e) { alert("Error creating admin"); }
    }

    function openEditAdmin(user, pass, status) {
        editingAdminUser = user;
        document.getElementById('editAdminName').innerText = user.toUpperCase();
        document.getElementById('editAdminPass').value = '';
        document.getElementById('editAdminStatus').value = status;
        document.getElementById('editAdminDays').value = '';
        document.getElementById('editAdminModal').style.display = 'flex';
    }

    function closeEditModal() {
        document.getElementById('editAdminModal').style.display = 'none';
        editingAdminUser = '';
    }

    async function submitEditAdmin() {
        const pass = document.getElementById('editAdminPass').value.trim();
        const status = document.getElementById('editAdminStatus').value;
        const days = document.getElementById('editAdminDays').value.trim();

        const body = new URLSearchParams({
            username: editingAdminUser,
            password: pass,
            status: status,
            days: days
        });

        try {
            const res = await fetch(`${API_BASE}/master/edit_admin`, { method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: body });
            const data = await res.json();
            alert(data.msg || "Updated!");
            closeEditModal();
            loadAdmins();
        } catch (e) { alert("Error updating admin"); }
    }

    async function deleteAdmin(user) {
        if (!confirm(`Admin [${user.toUpperCase()}] ko permanently delete karein?`)) return;
        const body = new URLSearchParams({ username: user });
        try {
            const res = await fetch(`${API_BASE}/master/delete_admin`, { method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: body });
            const data = await res.json();
            if (data.success) { alert("Deleted!"); loadAdmins(); }
        } catch (e) { alert("Error!"); }
    }

    window.onload = loadAll;
</script>

</body>
</html>
