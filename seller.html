<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reseller Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0B0C16;
            --card: #141727;
            --card-inner: #0D0F1B;
            --input: #0D0F1C;
            --primary: #6366F1;
            --success: #10B981;
            --danger: #EF4444;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border: #1E233D;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 24px 16px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: var(--primary);
        }

        .btn-refresh {
            background-color: var(--border);
            color: #38BDF8;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 18px;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            background-color: var(--input);
            border: 1px solid var(--border);
            color: #fff;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            color-scheme: dark;
        }

        .input-group input:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--success);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .key-item {
            background-color: var(--card-inner);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 18px;
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .item-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .key-name {
            font-size: 16px;
            font-weight: 700;
            color: #60A5FA;
            font-family: monospace;
            letter-spacing: 0.5px;
        }

        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .badge-unused { background: rgba(56, 189, 248, 0.15); color: #38BDF8; }
        .badge-active { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .badge-expired { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .badge-frozen { background: rgba(245, 158, 11, 0.15); color: #F59E0B; }

        .item-details {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .item-details span {
            color: var(--text-main);
            font-weight: 600;
        }

        .item-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 6px;
        }

        .btn-action {
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-copy { background: rgba(99, 102, 241, 0.2); color: #818CF8; }
        .btn-hwid { background: rgba(245, 158, 11, 0.2); color: #F59E0B; }
        .btn-delete { background: rgba(239, 68, 68, 0.2); color: #EF4444; }

        .empty-text {
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            padding: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>RESELLER CONTROL PANEL</h1>
        <button class="btn-refresh" onclick="loadKeys()">REFRESH</button>
    </div>

    <!-- Login / Wallet Info Card -->
    <div class="card">
        <div class="card-title">RESELLER ACCOUNT</div>
        <div class="form-grid">
            <div class="input-group">
                <label>Your Reseller ID</label>
                <input type="text" id="reseller_user" placeholder="Enter your ID" oninput="saveCredentials()">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="reseller_pass" placeholder="Enter password" oninput="saveCredentials()">
            </div>
            <div class="input-group">
                <label>Wallet Balance</label>
                <input type="text" id="wallet_balance" value="₹0.00" readonly style="color: #34D399; font-weight: bold;">
            </div>
        </div>
    </div>

    <!-- Generate Key Card -->
    <div class="card">
        <div class="card-title">
            <span>GENERATE LICENSE KEY</span>
            <span style="font-size: 12px; color: #60A5FA; cursor: pointer;" onclick="makeRandomKey()">⚡ Random Key</span>
        </div>
        <form id="keyForm" onsubmit="generateKey(event)">
            <div class="form-grid">
                <div class="input-group">
                    <label>License Key</label>
                    <input type="text" id="new_key" placeholder="VIP-XXXX-XXXX" required>
                </div>

                <!-- DATE & TIME PICKER -->
                <div class="input-group">
                    <label>Expiry Date & Exact Time</label>
                    <input type="datetime-local" id="expiry_datetime" required>
                </div>

                <div class="input-group">
                    <label>Deduction Amount (₹)</label>
                    <input type="number" id="key_cost" value="40" required>
                </div>
            </div>
            <button type="submit" class="btn-submit">CREATE LICENSE KEY</button>
        </form>
    </div>

    <!-- Keys List Card -->
    <div class="card">
        <div class="card-title">MY KEYS</div>
        <div id="keysList">
            <div class="empty-text">Apna Reseller ID aur Password enter karke REFRESH karein.</div>
        </div>
    </div>
</div>

<script>
    const API_BASE = "https://vip-auth-api-1.onrender.com";

    // Default Date-Time 24 ghante aage ka set karein
    function setDefaultDateTime() {
        const d = new Date();
        d.setDate(d.getDate() + 1);
        d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
        document.getElementById('expiry_datetime').value = d.toISOString().slice(0, 16);
    }

    function makeRandomKey() {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        let r1 = "", r2 = "";
        for (let i = 0; i < 4; i++) r1 += chars.charAt(Math.floor(Math.random() * chars.length));
        for (let i = 0; i < 4; i++) r2 += chars.charAt(Math.floor(Math.random() * chars.length));
        document.getElementById('new_key').value = "VIP-" + r1 + "-" + r2;
    }

    function saveCredentials() {
        localStorage.setItem('seller_u', document.getElementById('reseller_user').value.trim());
        localStorage.setItem('seller_p', document.getElementById('reseller_pass').value.trim());
    }

    function loadSavedCredentials() {
        const u = localStorage.getItem('seller_u') || '';
        const p = localStorage.getItem('seller_p') || '';
        if (u) document.getElementById('reseller_user').value = u;
        if (p) document.getElementById('reseller_pass').value = p;
        if (u) loadKeys();
    }

    async function loadKeys() {
        const user = document.getElementById('reseller_user').value.trim().toLowerCase();
        const container = document.getElementById('keysList');

        if (!user) {
            container.innerHTML = '<div class="empty-text">Pehle apna Reseller ID enter karein.</div>';
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/reseller/data?username=${encodeURIComponent(user)}`);
            const data = await res.json();

            if (!data.success) {
                container.innerHTML = `<div class="empty-text">${data.msg || "Reseller data load nahi hua"}</div>`;
                return;
            }

            document.getElementById('wallet_balance').value = `₹${(data.balance || 0).toFixed(2)}`;

            const keys = data.keys || [];
            if (keys.length === 0) {
                container.innerHTML = '<div class="empty-text">Koi key generate nahi hui hai.</div>';
                return;
            }

            const now = Date.now();
            let html = '';

            keys.forEach(k => {
                const exp = k.expiry_timestamp || 0;
                const isExp = exp > 0 && now > exp;
                let status = k.status || 'unused';
                if (isExp) status = 'expired';

                const expStr = exp > 0 ? new Date(exp).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' }) : 'No Expiry';

                html += `
                    <div class="key-item">
                        <div class="item-top">
                            <span class="key-name">${k.key}</span>
                            <span class="badge badge-${status}">${status.toUpperCase()}</span>
                        </div>
                        <div class="item-details">
                            Expiry: <span>${expStr}</span> | Plan: <span>${k.plan || 'Custom'}</span><br>
                            Device (HWID): <span>${k.hwid ? k.hwid.slice(0, 18) + '...' : 'Not Bound (Khali)'}</span>
                        </div>
                        <div class="item-actions">
                            <button class="btn-action btn-copy" onclick="copyKey('${k.key}')">COPY</button>
                            ${k.hwid ? `<button class="btn-action btn-hwid" onclick="resetHWID('${k.key}')">RESET HWID</button>` : ''}
                            <button class="btn-action btn-delete" onclick="deleteKey('${k.key}')">DELETE</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        } catch (err) {
            container.innerHTML = '<div class="empty-text">Server load hone mein issue hai. Refresh karein.</div>';
        }
    }

    async function generateKey(e) {
        e.preventDefault();
        const user = document.getElementById('reseller_user').value.trim().toLowerCase();
        const key = document.getElementById('new_key').value.trim().toUpperCase();
        const cost = document.getElementById('key_cost').value;
        const dtVal = document.getElementById('expiry_datetime').value;

        if (!user) {
            alert("Pehle apna Reseller ID daalein!");
            return;
        }
        if (!dtVal) {
            alert("Expiry Date & Time select karein!");
            return;
        }

        const targetMs = new Date(dtVal).getTime();
        if (targetMs <= Date.now()) {
            alert("Future (aane wale samay) ki Date aur Time select karein!");
            return;
        }

        const dateStr = new Date(targetMs).toLocaleDateString('en-GB');
        const timeStr = new Date(targetMs).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const body = new URLSearchParams({
            username: user,
            key: key,
            cost: cost,
            expiry_timestamp: targetMs,
            plan_name: `Till ${dateStr} ${timeStr}`
        });

        try {
            const res = await fetch(`${API_BASE}/reseller/generate_key`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body
            });
            const data = await res.json();
            alert(data.msg || (data.success ? `Key [${key}] generate ho gayi!` : 'Fail'));
            if (data.success) {
                makeRandomKey();
                loadKeys();
            }
        } catch (err) {
            alert('Error generating key');
        }
    }

    function copyKey(key) {
        navigator.clipboard.writeText(key).then(() => alert("Key copied: " + key));
    }

    async function resetHWID(key) {
        const user = document.getElementById('reseller_user').value.trim().toLowerCase();
        if (!confirm(`Key [${key}] ka Device HWID reset karein?`)) return;

        const body = new URLSearchParams({ username: user, key: key, reset_hwid: 'true' });
        try {
            const res = await fetch(`${API_BASE}/reseller/edit_key`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body
            });
            const data = await res.json();
            alert(data.msg || "Updated");
            loadKeys();
        } catch (err) {
            alert("Reset fail!");
        }
    }

    async function deleteKey(key) {
        const user = document.getElementById('reseller_user').value.trim().toLowerCase();
        if (!confirm(`Key [${key}] ko permanently delete karein?`)) return;

        const body = new URLSearchParams({ username: user, key: key });
        try {
            const res = await fetch(`${API_BASE}/reseller/delete_key`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body
            });
            const data = await res.json();
            alert(data.msg || "Deleted");
            loadKeys();
        } catch (err) {
            alert("Delete fail!");
        }
    }

    window.onload = function() {
        setDefaultDateTime();
        makeRandomKey();
        loadSavedCredentials();
    };
</script>

</body>
</html>
